<svg xmlns="http://www.w3.org/2000/svg" width="800" height="534" viewBox="0 0 800 534">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a47"/>
      <stop offset="1" stop-color="#1d5a8c"/>
    </linearGradient>
    <linearGradient id="device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe5ee"/>
    </linearGradient>
  </defs>
  <rect width="800" height="534" fill="url(#sky)"/>
  <!-- the cloud -->
  <g transform="translate(600 120)" fill="#e8f1fb" opacity="0.95">
    <circle cx="-50" cy="10" r="38"/>
    <circle cx="0" cy="-12" r="52"/>
    <circle cx="56" cy="8" r="40"/>
    <rect x="-88" y="8" width="182" height="42" rx="21"/>
  </g>
  <!-- the shelf -->
  <rect x="0" y="470" width="800" height="64" fill="#0b1e33"/>
  <rect x="0" y="462" width="800" height="12" fill="#163a5e"/>
  <!-- a sensor: a small rounded square, its status light -->
  <g transform="translate(170 392)">
    <rect x="-60" y="-60" width="120" height="120" rx="26" fill="url(#device)"/>
    <rect x="-60" y="-60" width="120" height="120" rx="26" fill="none" stroke="#9fb4c8" stroke-width="2"/>
    <circle cx="0" cy="0" r="14" fill="#3aa0ff"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#3aa0ff" stroke-width="3" opacity="0.5"/>
  </g>
  <!-- the gateway: a puck plugged in, its waves -->
  <g transform="translate(400 420)">
    <rect x="-70" y="-36" width="140" height="72" rx="20" fill="url(#device)"/>
    <circle cx="44" cy="0" r="7" fill="#38d39f"/>
    <g stroke="#7fc4ff" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M-20 -54 C-8 -66 8 -66 20 -54"/>
      <path d="M-36 -70 C-14 -92 14 -92 36 -70"/>
    </g>
  </g>
  <!-- the samples going up -->
  <g stroke="#7fc4ff" stroke-width="5" fill="none" stroke-dasharray="12 9" stroke-linecap="round">
    <path d="M240 380 C290 380 320 410 330 418"/>
    <path d="M430 340 C470 260 520 210 560 186"/>
  </g>
  <!-- the readings -->
  <g font-family="DejaVu Sans, Arial, sans-serif" font-weight="bold">
    <rect x="560" y="262" width="200" height="66" rx="14" fill="#ffffff" opacity="0.12"/>
    <text x="582" y="308" font-size="36" fill="#ffb27a">21.4 °C</text>
    <rect x="560" y="342" width="200" height="66" rx="14" fill="#ffffff" opacity="0.12"/>
    <text x="582" y="388" font-size="36" fill="#7fd0ff">48 %</text>
  </g>
  <g font-family="DejaVu Sans, Arial, sans-serif" fill="#ffffff">
    <text x="40" y="96" font-size="60" font-weight="bold">SensorPush</text>
    <text x="42" y="142" font-size="28">Cloud for Gladys Assistant</text>
    <text x="42" y="182" font-size="20" fill="#cfe3f5">temperature · humidity · pressure · alerts</text>
  </g>
</svg>
